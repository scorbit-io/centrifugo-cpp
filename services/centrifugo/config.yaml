admin:
  enabled: true
  password: "password"
  secret: "admin-secret"

client:
  token:
    hmac_secret_key: "my-secret-key"
  allowed_origins: ["*"]

channel:
  without_namespace:
    allow_subscribe_for_client: true
    allow_publish_for_subscriber: true
  # Used by tests/recovery_test.cpp via server-side (JWT `channels`) subscriptions.
  namespaces:
    - name: "stream"
      history_size: 10
      history_ttl: "300s"
      force_recovery: true
    - name: "cache"
      history_size: 1
      history_ttl: "300s"
      force_recovery: true
      force_recovery_mode: "cache"
      auto_cache_recover: true
    - name: "cachec"
      history_size: 1
      history_ttl: "300s"
      force_recovery: true
      force_recovery_mode: "cache"
    # Closed like the API's live_dmd: subscribing needs a subscription token.
    - name: "live"
      allow_subscribe_for_client: false
      allow_history_for_subscriber: true
      history_size: 10
      history_ttl: "30s"
      force_recovery: true
    # Used by tests/recovery_test.cpp for client-level publish (no subscription).
    - name: "pub"
      allow_publish_for_client: true
      history_size: 1
      history_ttl: "300s"
    # Publish proxy that always fails: Centrifugo answers code 100, temporary.
    - name: "proxied"
      publish_proxy_enabled: true
  proxy:
    publish:
      endpoint: "http://jwt-generator:3001/publish-proxy"
      timeout: "10s"

http_api:
  key: "api-key"

log:
  level: "debug"
