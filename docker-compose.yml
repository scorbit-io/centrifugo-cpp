services:
  jwt-generator:
    build: ./services/jwt-generator
    ports:
      - "127.0.0.1:${JWT_PORT:-3001}:3001"
    environment:
      - JWT_SECRET=my-secret-key
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v6.9.6
    command: centrifugo --config=/centrifugo/config.yaml
    ports:
      - "127.0.0.1:${CENTRIFUGO_PORT:-8000}:8000"
    volumes:
      - ./services/centrifugo/config.yaml:/centrifugo/config.yaml
    restart: unless-stopped
